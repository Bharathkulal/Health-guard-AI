services:
  - type: web
    name: healthguard-ai-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "false"
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: healthguard
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:5174,https://*.vercel.app"
